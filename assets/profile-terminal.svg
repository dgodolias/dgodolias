<svg width="1320" height="720" viewBox="0 0 1320 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">dgodolias terminal profile README</title>
  <desc id="desc">An animated neofetch-style GitHub profile card for Dimosthenis Gkontolias.</desc>
  <style>
    .mono, .caption, .ascii, .handle, .prompt, .cmd, .foot, .foot-hi {
      font-family: "Cascadia Mono", "Consolas", "SF Mono", "Liberation Mono", "DejaVu Sans Mono", monospace;
    }
    .page { fill: #0d1117; }
    .frame { fill: #161b22; stroke: #8b949e; stroke-width: 1.2; }
    .bar { fill: #0d1117; opacity: .86; }
    .caption { fill: #f0f6fc; font-size: 15px; font-weight: 600; }
    .handle { fill: #f0f6fc; font-size: 22px; font-weight: 500; }
    .rule { stroke: #8b949e; stroke-width: 1; opacity: .8; }
    .ascii { fill: #dbe7f3; font-size: 9.2px; }
    .mono { font-size: 15px; }
    .key { fill: #ff9f43; font-weight: 600; }
    .dots { fill: #6e7681; }
    .value { fill: #79c0ff; }
    .prompt { fill: #3fb950; font-size: 15px; font-weight: 600; }
    .cmd { fill: #f0f6fc; font-size: 15px; }
    .foot { fill: #6e7681; font-size: 12.5px; }
    .foot-hi { fill: #8b949e; font-size: 12.5px; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse  { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

    .an-frame { opacity: 0; animation: fadeIn .5s ease-out 0.15s forwards; }
    .an-ascii { opacity: 0; animation: fadeIn 1.1s ease-out 1.85s forwards; }
    .row      { opacity: 0; animation: fadeUp .42s cubic-bezier(.2,.7,.3,1) forwards; }
    .an-foot  { opacity: 0; animation: fadeIn .6s ease-out 3.51s forwards; }
    .caret    { opacity: 0; animation: blink 1.06s step-end 3.71s infinite; }
    .live     { animation: pulse 2.4s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .an-frame, .an-ascii, .row, .an-foot { opacity: 1; animation: none; }
      .caret { opacity: 1; animation: none; }
      .live  { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="typeclip">
      <rect x="-4" y="-18" width="0" height="26">
        <animate attributeName="width" dur="1.05s" begin="0.55s" fill="freeze" calcMode="discrete" values="0.0;9.03;18.06;27.09;36.12;45.15;54.18;63.21;72.24;81.27;90.3;99.33;108.36;117.39;126.42;135.45;144.48;153.51;162.54;171.57;180.6;189.63;198.66;207.69;216.72;225.75;234.78;243.81;252.84"/>
      </rect>
    </clipPath>
  </defs>

  <rect class="page" width="1320" height="720" rx="16"/>
  <g class="an-frame">
    <rect class="frame" x="18" y="18" width="1284" height="684" rx="14"/>
    <rect class="bar" x="38" y="78" width="1244" height="606" rx="13"/>
    <circle cx="64" cy="47" r="7" fill="#f85149"/>
    <circle cx="88" cy="47" r="7" fill="#d29922"/>
    <circle cx="112" cy="47" r="7" fill="#3fb950"/>
    <text class="caption" x="136" y="52">dgodolias / README.md</text>
  </g>

  <g transform="translate(60 112)">
    <text class="prompt" x="0" y="0">$</text>
    <g clip-path="url(#typeclip)" transform="translate(18 0)">
      <text class="cmd" x="0" y="0">neofetch --profile dgodolias</text>
    </g>
    <rect class="caret" x="274.8" y="-12" width="9" height="16" fill="#3fb950"/>
  </g>

