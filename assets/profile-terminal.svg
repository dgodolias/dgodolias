<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Terminal profile card for Dimosthenis Gkontolias</title>
  <desc id="desc">A neofetch-style GitHub profile card with focus areas, stack, projects, and contact links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.22 0 0 0 0 0.74 0 0 0 0 0.96 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .title { fill: #e5e7eb; font-size: 30px; font-weight: 700; }
      .muted { fill: #94a3b8; font-size: 18px; }
      .line { fill: #cbd5e1; font-size: 19px; }
      .key { fill: #fb923c; font-size: 19px; font-weight: 700; }
      .val { fill: #93c5fd; font-size: 19px; }
      .green { fill: #86efac; }
      .orange { fill: #fb923c; }
      .blue { fill: #7dd3fc; }
      .ascii { fill: #e0f2fe; font-size: 20px; }
      .tiny { fill: #64748b; font-size: 15px; }
    </style>
  </defs>

  <rect width="1200" height="600" rx="26" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="564" rx="22" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="18" y="18" width="1164" height="6" rx="3" fill="url(#edge)"/>
  <circle cx="54" cy="52" r="8" fill="#ef4444"/>
  <circle cx="82" cy="52" r="8" fill="#f59e0b"/>
  <circle cx="110" cy="52" r="8" fill="#22c55e"/>
  <text x="148" y="58" class="mono muted">dgodolias@github: ~/profile</text>

