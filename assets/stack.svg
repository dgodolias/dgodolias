<svg width="1320" height="520" viewBox="0 0 1320 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">dgodolias language and stack card</title>
  <desc id="d">Languages by repository count and the tools Dimosthenis Gkontolias works with.</desc>
  <style>
    .mono, .caption, .prompt, .cmd, .lab, .val, .chip-t, .foot {
      font-family: "Cascadia Mono", "Consolas", "SF Mono", "Liberation Mono", "DejaVu Sans Mono", monospace;
    }
    .page { fill: #0d1117; }
    .frame { fill: #161b22; stroke: #8b949e; stroke-width: 1.2; }
    .bar { fill: #0d1117; opacity: .86; }
    .caption { fill: #f0f6fc; font-size: 15px; font-weight: 600; }
    .prompt { fill: #3fb950; font-size: 15px; font-weight: 600; }
    .cmd { fill: #f0f6fc; font-size: 15px; }
    .head { fill: #6e7681; font-size: 11.5px; letter-spacing: 1.6px; font-weight: 600; }
    .lab { fill: #f0f6fc; font-size: 13px; }
    .val { fill: #6e7681; font-size: 12px; }
    .track { fill: #21262d; }
    .chip { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .chip-t { fill: #adbac7; font-size: 12.5px; }
    .foot { fill: #6e7681; font-size: 12.5px; }
    .foot-hi { fill: #79c0ff; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .an-frame { opacity: 0; animation: fadeIn .5s ease-out .15s forwards; }
    .item     { opacity: 0; animation: fadeUp .42s cubic-bezier(.2,.7,.3,1) forwards; }
    .caret    { opacity: 0; animation: blink 1.06s step-end 1.5s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .an-frame, .item { opacity: 1; animation: none; }
      .caret { opacity: 1; animation: none; }
      .grow  { display: none; }
    }
  </style>
  <defs>
    <clipPath id="typeclip">
      <rect x="-4" y="-18" width="0" height="26">
        <animate attributeName="width" dur="0.95s" begin="0.5s" fill="freeze" calcMode="discrete" values="0.0;9.03;18.06;27.09;36.12;45.15;54.18;63.21;72.24;81.27;90.3;99.33;108.36;117.39;126.42;135.45;144.48;153.51;162.54;171.57;180.6;189.63;198.66;207.69;216.72;225.75;234.78;243.81"/>
      </rect>
    </clipPath>
  </defs>

  <rect class="page" width="1320" height="520" rx="16"/>
  <g class="an-frame">
    <rect class="frame" x="18" y="18" width="1284" height="484" rx="14"/>
    <rect class="bar" x="38" y="78" width="1244" height="406" rx="13"/>
    <circle cx="64" cy="47" r="7" fill="#f85149"/>
    <circle cx="88" cy="47" r="7" fill="#d29922"/>
    <circle cx="112" cy="47" r="7" fill="#3fb950"/>
    <text class="caption" x="136" y="52">dgodolias / stack</text>
  </g>

  <g transform="translate(60 112)">
