name: refresh cards

# Rebuilds the SVG cards from live GitHub data so the numbers on the profile
# never go stale. Runs daily, and can be triggered by hand from the Actions tab.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "assets/ascii-art.txt"
      - ".github/workflows/refresh-cards.yml"

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch profile data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$USER" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks {
                      firstDay
                      contributionDays { date contributionCount contributionLevel weekday }
                    }
                  }
                }
                repositories(first: 100, isFork: false, privacy: PUBLIC, ownerAffiliations: OWNER) {
                  nodes {
                    name
                    stargazerCount
                    languages(first: 5, orderBy: {field: SIZE, direction: DESC}) {
                      edges { size node { name color } }
                    }
                  }
                }
              }
            }' > data.json
          python -c "import json;d=json.load(open('data.json'));assert d['data']['user']['repositories']['nodes'],'empty payload';print('payload ok')"

      - name: Rebuild cards
        run: |
          python scripts/gen_contributions.py data.json assets/contributions.svg
          python scripts/gen_terminal.py data.json assets/ascii-art.txt assets/profile-terminal.svg
          python scripts/gen_stack.py data.json assets/stack.svg
          python - <<'PY'
          import xml.etree.ElementTree as ET, glob
          for f in glob.glob('assets/*.svg'):
              ET.parse(f)
              print('valid:', f)
          PY

      - name: Commit if changed
        run: |
          rm -f data.json
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "cards unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile cards"
          git push
